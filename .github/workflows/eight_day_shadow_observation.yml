name: Eight-Day Shadow Observation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  shadow-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_market_regime_lab_v1.txt
          pip install -r requirements_hall_of_fame_portfolio_v1.txt
          pip install -r requirements_championship_scanner_v1.txt
          pip install -r requirements_two_bot_shadow_controller_v1.txt
          pip install -r requirements_eight_day_shadow_observation_v1.txt

      - name: Run shadow observation
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SHADOW_REPORT_EMAIL_TO: ${{ secrets.SHADOW_REPORT_EMAIL_TO }}
          SHADOW_REPORT_EMAIL_FROM: ${{ secrets.SHADOW_REPORT_EMAIL_FROM }}
          SHADOW_REPORT_SMTP_HOST: ${{ secrets.SHADOW_REPORT_SMTP_HOST }}
          SHADOW_REPORT_SMTP_PORT: ${{ secrets.SHADOW_REPORT_SMTP_PORT }}
          SHADOW_REPORT_SMTP_USERNAME: ${{ secrets.SHADOW_REPORT_SMTP_USERNAME }}
          SHADOW_REPORT_SMTP_PASSWORD: ${{ secrets.SHADOW_REPORT_SMTP_PASSWORD }}
        run: python eight_day_shadow_observation_v1.py

      - name: Run shadow performance tracker
        run: python shadow_performance_tracker_v1.py

      - name: Commit observation and performance reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d "reports" ]; then
            git add -A reports
          fi

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update shadow observation and performance reports"
            git pull --rebase origin main
            git push origin main
          fi